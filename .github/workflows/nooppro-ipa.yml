# NOOP Pro: test the glucose package, build an unsigned sideload .ipa, and publish it to a rolling
# "nooppro-latest" release so it can be downloaded straight to the iPhone and opened in SideStore.
name: NOOP Pro IPA

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Self-healing: GitHub's hosted Mac pool sometimes never acquires the job ("not acquired by Runner
  # of type hosted even after multiple attempts"). Every 30 min, build again if the published IPA is
  # not yet the current main.
  schedule:
    - cron: "7,37 * * * *"

concurrency:
  group: nooppro-ipa-${{ github.ref }}
  # Never cancel a build that is running; a newer trigger waits its turn instead.
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      need: ${{ steps.c.outputs.need }}
    steps:
      - uses: actions/checkout@v5
      - id: c
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHORT=$(git rev-parse --short HEAD)
          BODY=$(gh release view nooppro-latest --json body -q .body 2>/dev/null || true)
          if [ "${{ github.event_name }}" = "schedule" ] && echo "$BODY" | grep -q "$SHORT"; then
            echo "need=false" >> "$GITHUB_OUTPUT"; echo "IPA for $SHORT already published"
          else
            echo "need=true" >> "$GITHUB_OUTPUT"
          fi

  glucose-tests:
    needs: check
    # Paused while hosted Mac capacity is scarce: every Mac request competes with the app build. The
    # package was last verified green on 14 Nov and its tests run with each manual dispatch.
    if: github.event_name == 'workflow_dispatch' && needs.check.outputs.need == 'true'

    # macos-26: the macos-15 pool stopped picking this job up (queued until cancelled, 18 Nov).
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - name: Test StrandGlucose
        working-directory: Packages/StrandGlucose
        run: swift test

  ios:
    # Runs in parallel with the package tests so a slow runner queue costs one wait, not two.
    needs: check
    if: needs.check.outputs.need == 'true'
    # Hosted Mac capacity has been failing to acquire jobs for hours at a time (18 Nov). Ask three
    # different Mac pools at once; whichever gets a machine builds and publishes. Duplicates are harmless
    # (same commit, same asset names, --clobber).
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-26, macos-15, macos-latest, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 50
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Select an Xcode 26 toolchain (iOS 26 SDK)
        run: |
          XC=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XC" ] && xcodebuild -version | grep -q 'Xcode 26'; then XC=$(xcode-select -p | sed 's#/Contents/Developer##'); fi
          [ -n "$XC" ] || { echo "No Xcode 26 on this runner image"; ls /Applications | grep Xcode; exit 1; }
          sudo xcode-select -s "$XC"
          xcodebuild -version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build number
        # Every CI build gets its own, always-increasing build number (CFBundleVersion). SideStore and the
        # app's own update check compare it, so a new build of the same marketing version still reads as
        # an update. 1000+ keeps it above the 439 that builds before this carried.
        run: echo "BUILD_NUM=$((1000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
      - name: Build NOOPiOS (unsigned, Release)
        run: >-
          set -o pipefail &&
          xcodebuild -scheme NOOPiOS -configuration Release -destination 'generic/platform=iOS'
          -derivedDataPath build/dd
          CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""
          CURRENT_PROJECT_VERSION="$BUILD_NUM"
          build 2>&1 | tee build.log | grep -E 'error:|warning: .*Glucose|BUILD (SUCCEEDED|FAILED)' || true;
          grep -q 'BUILD SUCCEEDED' build.log
      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ matrix.runner }}
          path: build.log
      - name: Package .ipa
        id: pkg
        run: |
          APP=$(find build/dd/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -type d | head -1)
          test -n "$APP" || { echo ".app not found"; exit 1; }
          # Free Apple ID: watch apps cost extra App IDs and rarely sideload; the widget stays.
          rm -rf "$APP/Watch"
          Tools/prepare-ios-sideload-app.sh "$APP"
          rm -rf Payload && mkdir Payload && cp -R "$APP" Payload/
          SHORT=$(git rev-parse --short HEAD)
          IPA="NOOP-Pro-${SHORT}.ipa"
          zip -qr "$IPA" Payload
          VER=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Info.plist")
          BLD=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP/Info.plist")
          test "$BLD" = "$BUILD_NUM" || { echo "build number not applied: $BLD != $BUILD_NUM"; exit 1; }
          # The app icon for the SideStore source (largest loose AppIcon PNG in the bundle).
          ICON=$(ls -S "$APP"/AppIcon*.png 2>/dev/null | head -1 || true)
          if [ -n "$ICON" ]; then cp "$ICON" icon.png; fi
          SUBJECT=$(git log -1 --pretty=%s)
          BASE="https://github.com/${GITHUB_REPOSITORY}/releases/download/nooppro-latest"
          python3 Tools/nooppro-sidestore-source.py "$APP" "$IPA" "$BASE/$IPA" "$BASE/icon.png" \
            "$BASE/sidestore-source.json" "Build ${SHORT}: ${SUBJECT}" sidestore-source.json
          echo "ipa=$IPA" >> "$GITHUB_OUTPUT"
          echo "short=$SHORT" >> "$GITHUB_OUTPUT"
          echo "version=${VER}.${BLD}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: NOOP-Pro-ipa-${{ matrix.runner }}
          path: ${{ steps.pkg.outputs.ipa }}
      - name: Publish to the rolling release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=nooppro-latest
          # "version X.Y.Z.B" is what the app's update check reads; "Build <sha>" is what the scheduled
          # retry looks for. Keep both.
          NOTES="Build ${{ steps.pkg.outputs.short }} · version ${{ steps.pkg.outputs.version }} — $(git log -1 --pretty=%s)

          SideStore source (add once in SideStore → Sources): https://github.com/${GITHUB_REPOSITORY}/releases/download/nooppro-latest/sidestore-source.json"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --notes "$NOTES" --prerelease
            for a in $(gh release view "$TAG" --json assets --jq '.assets[].name'); do gh release delete-asset "$TAG" "$a" -y; done
          else
            gh release create "$TAG" --title "NOOP Pro (latest build)" --notes "$NOTES" --prerelease --target "$GITHUB_SHA"
          fi
          cp "${{ steps.pkg.outputs.ipa }}" NOOP-Pro.ipa
          EXTRA=""
          if [ -f icon.png ]; then EXTRA="icon.png"; fi
          gh release upload "$TAG" "${{ steps.pkg.outputs.ipa }}" NOOP-Pro.ipa sidestore-source.json $EXTRA --clobber
